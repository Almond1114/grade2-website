<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="group" aria-labelledby="title desc"><title id="title">2F 仮の校内図</title><desc id="desc">実際の校舎図ではありません。部屋を選択すると企画を表示します。</desc><style>text{font:16px sans-serif;fill:#254f58}.room rect{fill:#fff;stroke:#b5cdd2;stroke-width:2}.room{cursor:pointer}.room:hover rect,.room:focus rect,.room.selected-room rect{fill:#d3ecef;stroke:#066d78;stroke-width:4}.room:focus{outline:none}</style><rect width="760" height="330" rx="16" fill="#eaf3f5"/><text x="32" y="35" font-weight="bold">2F / ILLUSTRATIVE MAP</text><g role="button" tabindex="0" aria-label="2年3組教室" data-location="escape" class="room"><rect x="32" y="62" width="214" height="134" rx="8"/><text x="139" y="136" text-anchor="middle">2年3組教室</text></g><g role="button" tabindex="0" aria-label="美術室" data-location="art" class="room"><rect x="270" y="62" width="214" height="134" rx="8"/><text x="377" y="136" text-anchor="middle">美術室</text></g><g role="button" tabindex="0" aria-label="休憩スペース" data-location="rest" class="room"><rect x="508" y="62" width="214" height="134" rx="8"/><text x="615" y="136" text-anchor="middle">休憩スペース</text></g><rect x="32" y="215" width="690" height="54" rx="8" fill="#d8e7ea"/><text x="376" y="250" text-anchor="middle">廊下（仮）</text><text x="32" y="310" font-size="14">サンプル配置 · 実際の校舎図に差し替えてください</text></svg>